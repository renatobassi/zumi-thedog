; Zumi — ESP32 CYD clássico (ESP32-2432S028R).
; Regras de jogo entram com PRD aprovado. Este arquivo só fixa os dois alvos.

[platformio]
default_envs = native

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -Wall
  -Wextra
  -std=gnu++17

[env:native]
platform = native
test_framework = unity
build_flags =
  -std=c++17
  -Wall
  -Wextra
build_src_filter =
  +<domain/>
  -<main.cpp>
  -<ui/>
  -<hal/>
  -<persistence/>

; Zumi — ESP32 CYD clássico (ESP32-2432S028R).
; Regras de jogo entram com PRD aprovado. Este arquivo só fixa os dois alvos.

[platformio]
default_envs = native

[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  bodmer/TFT_eSPI@2.5.43
; TFT_eSPI lê a tela daqui, não de um User_Setup.h da máquina.
; Os números conferem com hal/cyd_pins.hpp por static_assert em hal/cyd_display.cpp.
build_flags =
  -Wall
  -Wextra
  -std=gnu++17
  -DUSER_SETUP_LOADED=1
  -DILI9341_2_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DUSE_HSPI_PORT=1
  -DTFT_MOSI=13
  -DTFT_MISO=12
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DSPI_FREQUENCY=55000000
  -DSPI_READ_FREQUENCY=20000000

[env:native]
platform = native
test_framework = unity
build_flags =
  -std=c++17
  -Wall
  -Wextra
build_src_filter =
  +<domain/>
  -<main.cpp>
  -<ui/>
  -<hal/>
  -<persistence/>
